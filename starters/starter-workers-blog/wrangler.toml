name = "starter-workers-blog"
main = "src/index.ts"
compatibility_date = "2024-12-01"
# nodejs_compat enables node:crypto and other Node-compatible APIs in Workers
compatibility_flags = ["nodejs_compat"]

# ── Static assets ─────────────────────────────────────────────────────────────
# Serves the pre-built admin bundle (pnpm build:admin → public/admin/bundle.js).
# Requests that match a file in public/ are answered directly; everything else
# (including /admin/ itself) falls through to the Worker.
[assets]
directory = "./public"

# ── R2 bucket ─────────────────────────────────────────────────────────────────
# Create a bucket first: wrangler r2 bucket create starter-workers-blog-content
[[r2_buckets]]
binding = "LAIKACMS_BUCKET"
bucket_name = "starter-workers-blog-content"

[vars]
# Optional: override the bearer token Decap uses in dev mode.
# DEV_TOKEN = "dev-local-laika-token"

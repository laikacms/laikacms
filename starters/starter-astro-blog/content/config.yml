backend:
  name: laika
  base_url: /__laika
  dev_token: laika-local-dev
media_folder: public/uploads
public_folder: /uploads
collections:
  - name: posts
    label: Blog Posts
    folder: posts
    extension: md
    create: true
    slug: "{{slug}}"
    sortable_fields:
      - title
      - date
    fields:
      - label: Title
        name: title
        widget: string
      - label: Date
        name: date
        widget: datetime
      - label: Description
        name: description
        widget: string
        required: false
      - label: Body
        name: body
        widget: markdown

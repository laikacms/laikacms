packages:
  - "packages/laikacms"
  - "packages/server"
  - "packages/github"
  - "packages/gitlab"
  - "packages/bitbucket"
  - "packages/vite-plugin"
  - "packages/astro"
  - "docs"
  - "apps/website"
  - "apps/cli"

catalogs:

  # Vercel AI SDK, used by @laikacms/server/ai (optional peers there, so only
  # consumers that mount the AI endpoints install them).
  ai:
    "@ai-sdk/anthropic": "^4.0.16"
    "@ai-sdk/openai": "^4.0.16"
    "ai": "^7.0.31"

  astro:
    "@astrojs/check": "^0.9.10"
    "@astrojs/mdx": "^7.0.5"
    "@astrojs/react": "^6.0.2"
    "astro": "^7.1.6"

  aws:
    "aws-jwt-verify": "^5.2.1"
  default:
    "@effect/platform-node": "4.0.0-beta.104"
    "@effect/platform-node-shared": "4.0.0-beta.104"
    "@mdx-js/rollup": "^3.1.1"
    "@tailwindcss/vite": "^4.2.2"
    "bcryptjs": "^3.0.3"
    "effect": "4.0.0-beta.104"
    "es-module-lexer": "^2.3.1"
    "gray-matter": "^4.0.3"
    "import-meta-resolve": "^4.2.0"
    "js-yaml": "^5.2.1"
    "jsonwebtoken": "^9.0.3"
    "jwt-decode": "^4.0.0"
    "magic-string": "^1.1.0"
    "minimatch": "^10.2.5"
    "tailwindcss": "^4.2.2"
    "trash": "^10.1.1"
    "undici": "^8.7.0"
    "uuid": "^14.0.1"
    "ws": "^8.21.0"
    "yaml": "^2.9.0"

  docs:
    "@scalar/api-reference": "^1.73.1"
    "mermaid": "^12.1.0"
    "typedoc": "^0.28.20"
    "typedoc-plugin-markdown": "^4.13.1"
    "typedoc-vitepress-theme": "^1.1.4"

  lint:
    "@eslint/js": "^10.0.1"
    "@typescript-eslint/eslint-plugin": "^8.66.0"
    "@typescript-eslint/parser": "^8.66.0"
    "eslint": "^10.8.0"
    "globals": "^17.9.0"
    "typescript-eslint": "^8.66.0"
  octokit:
    "@octokit/auth-app": "^7.1.4"
    "@octokit/rest": "^22.0.1"

  react:
    "@vitejs/plugin-react": "^6.0.1"
    "react": "^19.2.8"
    "react-dom": "^19.2.4"

  schema:
    "@standard-schema/spec": "^1.1.0"
    "json-schema": "^0.4.0"

  server:
    "@hono/node-server": "^2.0.10"
    "hono": "^4.12.31"

  tanstack:
    "@tanstack/react-router": "1.170.10"
    "@tanstack/router-plugin": "^1.167.9"

  tools:
    "@vitest/coverage-v8": "^4.1.10"
    "rimraf": "^6.1.3"
    "rolldown": "^1.2.2"
    "tsup": "^8.5.1"
    "turbo": "^2.10.8"
    "typescript": "^6.0.3"
    "vite": "^8.2.0"
    "vitest": "^4.1.10"

  types:
    "@cloudflare/workers-types": "^5.20260719.1"
    "@types/bcryptjs": "^3.0.0"
    "@types/js-yaml": "^4.0.9"
    "@types/json-schema": "^7.0.15"
    "@types/jsonwebtoken": "^9.0.10"
    "@types/jwt-decode": "^3.1.0"
    "@types/mdx": "^2.0.14"
    "@types/node": "^24.13.3"
    "@types/react": "^19.2.17"
    "@types/react-dom": "^19.2.3"
    "@types/uuid": "^11.0.0"

  vue:
    "vitepress": "^1.6.4"
    "vue": "^3.5.40"

overrides:
  jsdom: "^29.1.1"
  stylus: "-"

# Do not fail on old peer dependencies from Decap CMS packages
strictPeerDependencies: false

# Keep pnpm 11's default minimumReleaseAge (24h) supply-chain protection, but
# exempt packages we bumped to same-day releases in d7ded4b7. Safe to remove
# once those entries are older than a day (after 2026-08-07).
minimumReleaseAgeExclude:
  - "@ai-sdk/*"
  - "ai"
  # Exact-version pins for the docs-only Scalar reference (LCMS-1017), published 2026-10-07T23:3xZ.
  # Safe to remove once they are older than a day (after 2026-10-09).
  - '@scalar/agent-chat@0.12.42'
  - '@scalar/api-client@3.22.0'
  - '@scalar/api-reference@1.73.1'
  - '@scalar/asyncapi-upgrader@0.1.16'
  - '@scalar/blocks@0.5.1'
  - '@scalar/components@0.31.0'
  - '@scalar/helpers@0.16.2'
  - '@scalar/json-magic@0.15.6'
  - '@scalar/localization@0.2.6'
  - '@scalar/oas-utils@0.20.11'
  - '@scalar/openapi-to-markdown@1.5.3'
  - '@scalar/openapi-upgrader@0.4.3'
  - '@scalar/schemas@0.13.1'
  - '@scalar/sidebar@0.11.13'
  - '@scalar/snippetz@0.10.7'
  - '@scalar/themes@0.19.0'
  - '@scalar/types@0.23.1'
  - '@scalar/use-hooks@0.4.19'
  - '@scalar/workspace-store@0.68.2'

allowBuilds:
  "@parcel/watcher": true
  dprint: true
  esbuild: true
  msgpackr-extract: true
  vue-demi: true

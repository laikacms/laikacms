name: Publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write # Required for npm OIDC trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: production # Optional: adds approval requirements and deployment protection
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint, typecheck, and unit tests
        run: pnpm run lint && pnpm run typecheck && pnpm run test

      - name: Build
        run: pnpm run build

      # `changeset publish` detects pnpm via the root packageManager field and
      # runs `pnpm publish` per package, so catalog: dependency ranges are
      # resolved in the tarballs — see scripts/check-no-catalog-deps.mjs.
      # pnpm >= 10.13 picks up npm OIDC trusted publishing automatically, so
      # no NODE_AUTH_TOKEN is needed. Already-published versions are skipped
      # (safe to re-run), private workspace packages are never published, and
      # in changesets pre mode the prerelease dist-tag (alpha/beta/rc) is used
      # automatically; stable versions go to latest. The per-package git tags
      # changeset publish creates in the runner are intentionally not pushed —
      # the v* tag that triggered this workflow is the release marker.
      - name: Publish to npm
        run: pnpm changeset publish
        env:
          NPM_CONFIG_PROVENANCE: 'true'

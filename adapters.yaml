# Every backend Laika ships an adapter for. Single source of truth for the docs adapter list and the
# per-adapter pages (compiled by docs/scripts/generate-adapter-docs.mjs).
#
#   key       unique, stable identifier — also the docs URL (/adapters/<key>). Matches the CLI's
#             `backend` name and the `laikacms/storage/<key>` subpath where those exist.
#   name      display name
#   icon      path (from the repo root) to the adapter's SVG, shown in light mode
#   iconDark  optional: the SVG for dark mode, for logos that disappear on a dark background.
#             Defaults to `icon`.
#   storage / documents / assets
#             folder (from the repo root) holding that repository's implementation and README.md.
#             Omit the ones the adapter doesn't provide.
#
# Paths are repo-relative so the adapters can live anywhere (core subpaths or their own packages).

- key: github
  name: GitHub
  icon: packages/github/icon.svg
  iconDark: packages/github/icon-dark.svg
  storage: packages/github

- key: gitlab
  name: GitLab
  icon: packages/gitlab/icon.svg
  storage: packages/gitlab


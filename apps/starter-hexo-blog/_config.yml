# Hexo Configuration
title: My Laika Blog
subtitle: 'A blog powered by Hexo + LaikaCMS'
description: ''
author: LaikaCMS
language: en
timezone: ''

url: http://localhost:4000
root: /
permalink: :year/:month/:day/:title/
permalink_defaults:

source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories

# Disable post asset folders (content managed by LaikaCMS admin)
post_asset_folder: false

# New post default layout
default_layout: post
titlecase: false

# Markdown rendering
marked:
  gfm: true
  breaks: false

# Date formatting
date_format: YYYY-MM-DD
time_format: HH:mm:ss

# Pagination
per_page: 10
pagination_dir: page

# Theme — minimal custom theme bundled with this starter
theme: laika

# Skip non-content directories from rendering
skip_render:
  - uploads/**

# Hexo Configuration — https://hexo.io/docs/configuration.html

title: My Blog
subtitle: ''
description: 'Powered by Hexo + LaikaCMS'
author: Laika User
language: en
timezone: ''

## URL
url: http://localhost:4000
root: /
permalink: /blog/:year/:month/:day/:title/

## Directory
source_dir: source        # LaikaCMS writes posts to source/_posts/
public_dir: public        # Generated site output
tag_dir: tags
archive_dir: archives
category_dir: categories

## Writing
default_layout: post
titlecase: false

## Date / Time format
date_format: YYYY-MM-DD
time_format: HH:mm:ss

## Pagination
per_page: 10

## Theme
# Using the default landscape theme.
# Remove or change to a custom theme in themes/ directory.
theme: landscape

## Deployment
deploy:
  type: ''

name = "laikacms-starter-workers-turso"
main = "src/index.ts"
compatibility_date = "2026-05-01"

# LibSqlDataSource uses only fetch() — no native Node modules required.
# Drop nodejs_compat to keep the bundle minimal (Turso HTTP works fine without it).

# Set secrets before deploying:
#   wrangler secret put LIBSQL_AUTH_TOKEN
#
# LIBSQL_URL can stay as a plain var (it's not sensitive):
#   wrangler deploy --var LIBSQL_URL=https://<db-name>-<org>.turso.io
#
# Or set both in .dev.vars for local development:
#   LIBSQL_URL=https://<db-name>-<org>.turso.io
#   LIBSQL_AUTH_TOKEN=<your-turso-jwt>
#
# For local sqld (no auth needed):
#   LIBSQL_URL=http://localhost:8080
[vars]
LIBSQL_URL = "http://localhost:8080"
# LIBSQL_TABLE defaults to "laika_storage" — override here or in .dev.vars

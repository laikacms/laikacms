{{ define "main" }}
<article>
  <h1>{{ .Title }}</h1>
  {{ if .Date }}
  <time style="color:#666">{{ .Date.Format "January 2, 2006" }}</time>
  {{ end }}
  {{ with .Params.description }}<p><em>{{ . }}</em></p>{{ end }}
  <div style="margin-top:1.5rem">{{ .Content }}</div>
  <p style="margin-top:2rem"><a href="/">← Back</a></p>
</article>
{{ end }}

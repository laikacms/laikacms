<!doctype html>
<!--
  Source for the social-share card rendered to public/assets/og-image.png.
  Regenerate with: node scripts/generate-og-image.mjs  (see that file for details).
  Kept in-tree so the card stays editable and reproducible — it is not served.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@500&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --indigo: #3f51b5;
        --bg: #fbfbfd;
        --surface: #ffffff;
        --ink: #16171d;
        --ink-2: #54586a;
        --ink-3: #888da0;
        --hairline-2: #dcdee9;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1200px; height: 630px; }
      body {
        position: relative;
        overflow: hidden;
        font-family: "IBM Plex Sans", system-ui, sans-serif;
        color: var(--ink);
        background:
          radial-gradient(120% 140% at 88% 12%, color-mix(in oklab, var(--indigo), white 84%), transparent 60%),
          radial-gradient(90% 120% at 0% 100%, color-mix(in oklab, var(--indigo), white 90%), transparent 55%),
          var(--bg);
      }
      /* faint dot grid */
      .grid {
        position: absolute; inset: 0;
        background-image: radial-gradient(color-mix(in oklab, var(--indigo), transparent 88%) 1.1px, transparent 1.1px);
        background-size: 30px 30px;
        mask: linear-gradient(115deg, #000 35%, transparent 78%);
        -webkit-mask: linear-gradient(115deg, #000 35%, transparent 78%);
      }
      /* dog motif, large + faint, bleeding off the right edge */
      .dog {
        position: absolute;
        top: 50%; right: -120px;
        width: 720px; height: 720px;
        transform: translateY(-50%);
        background: var(--indigo);
        -webkit-mask: url(../public/assets/laika-dog.svg) center / contain no-repeat;
        mask: url(../public/assets/laika-dog.svg) center / contain no-repeat;
        opacity: 0.1;
      }
      .frame {
        position: relative;
        z-index: 1;
        height: 100%;
        padding: 72px 80px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }
      .brand { display: flex; align-items: center; gap: 16px; }
      .brand img { width: 56px; height: 56px; }
      .brand .name {
        font-family: "Archivo", sans-serif;
        font-weight: 700;
        font-size: 30px;
        letter-spacing: -0.02em;
      }
      .pill {
        font-family: "IBM Plex Mono", monospace;
        font-size: 17px;
        color: var(--ink-2);
        display: inline-flex;
        align-items: center;
        gap: 11px;
        padding: 10px 18px;
        border: 1px solid var(--hairline-2);
        border-radius: 999px;
        background: var(--surface);
        align-self: flex-start;
        margin-bottom: 26px;
      }
      .pill .dot {
        width: 9px; height: 9px; border-radius: 999px;
        background: oklch(0.7 0.17 150);
        box-shadow: 0 0 0 4px color-mix(in oklab, oklch(0.7 0.17 150), transparent 78%);
      }
      h1 {
        font-family: "Archivo", sans-serif;
        font-weight: 600;
        font-size: 82px;
        line-height: 0.98;
        letter-spacing: -0.035em;
        max-width: 16ch;
      }
      h1 .muted { color: var(--ink-3); }
      p.lead {
        margin-top: 28px;
        font-size: 25px;
        line-height: 1.5;
        color: var(--ink-2);
        max-width: 30ch;
      }
      .url {
        font-family: "IBM Plex Mono", monospace;
        font-size: 20px;
        color: var(--ink-3);
        letter-spacing: 0.01em;
      }
    </style>
  </head>
  <body>
    <div class="grid"></div>
    <div class="dog"></div>
    <div class="frame">
      <div class="brand">
        <img src="../public/assets/laika-icon.png" alt="" />
        <span class="name">Laika CMS</span>
      </div>
      <div>
        <span class="pill"><span class="dot"></span>MIT licensed · open source · self-hostable</span>
        <h1>One content API.<br /><span class="muted">40+ swappable backends.</span></h1>
        <p class="lead">Runtime-agnostic content management — served as a JSON:API that runs anywhere fetch runs.</p>
      </div>
      <div class="url">laikacms.com</div>
    </div>
  </body>
</html>

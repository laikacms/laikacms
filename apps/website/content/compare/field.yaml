# Tone rule: describe competitors neutrally, then state the concrete difference.
heading: Where Laika sits.
lead: 'Laika is the API layer between your content and the apps that use it. These are the tools it is most often compared with, and where Laika differs.'
columns:
  - What it is
  - The Laika difference
rivals:
  - name: Contentful
    what: 'The enterprise SaaS standard. Polished and proven. Proprietary, priced per seat, with your content stored in their cloud.'
    laika: 'The same API-first workflow, MIT licensed, with content in a store you own.'
  - name: Sanity
    what: 'An open-source Studio in front of the proprietary hosted Content Lake: the editor is yours, the data layer is theirs.'
    laika: 'The API layer is MIT as well, and it runs in front of your own database, bucket or repository.'
  - name: Strapi
    what: 'Self-hosted open core on Node and SQL, with an Enterprise Edition and a cloud for the advanced features.'
    laika: 'MIT licensed throughout, and it runs on more than Node: Bun, Deno, Cloudflare Workers and the browser.'
  - name: Payload
    what: 'MIT, code-first and Next.js-native, backed by Postgres or MongoDB. Now part of Figma.'
    laika: 'Independent of any framework, with 40+ interchangeable backends instead of two.'
  - name: Tina
    what: 'The successor to Forestry: visual editing over Markdown, with the commercial TinaCloud at the centre.'
    laika: 'Git is one of many backends, and the whole stack can be self-hosted.'
  - name: EmDash
    what: 'An open-source, Astro-native CMS built for humans and agents.'
    laika: 'Works with any framework: Astro, or anything else that speaks fetch.'

{% extends "base.html" %}

{% block title %}{{ title }} — My Blog{% endblock %}

{% block content %}
  <article>
    <h1>{{ title }}</h1>
    {% if date %}
      <p style="color: #666"><time>{{ date }}</time></p>
    {% endif %}
    {# bodyHtml is sanitised HTML from remark/rehype — safe to render verbatim #}
    {{ bodyHtml | safe }}
  </article>
  <p><a href="/">← Back</a></p>
{% endblock %}
